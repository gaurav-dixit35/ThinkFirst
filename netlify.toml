[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  THINKFIRST_HOSTED = "1"

# Configure API URL and Clerk credentials in Netlify, never in this file.
# Next.js is served by Netlify's automatic OpenNext integration, not an SPA redirect.

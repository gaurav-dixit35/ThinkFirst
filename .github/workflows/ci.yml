name: Validate research instrument
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thinkfirst
          POSTGRES_PASSWORD: thinkfirst
          POSTGRES_DB: thinkfirst_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://thinkfirst:thinkfirst@localhost:5432/thinkfirst_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r apps/api/requirements.lock.txt
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run build

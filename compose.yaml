services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thinkfirst
      POSTGRES_PASSWORD: thinkfirst
      POSTGRES_DB: thinkfirst
    ports: ["55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkfirst"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://thinkfirst:thinkfirst@db:5432/thinkfirst
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres_data:
